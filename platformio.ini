; Film Scanner firmware
; Target: ESP32-S family (S2/S3). Default env below targets ESP32-S3 DevKitC-1;
; switch [platformio] default_envs or add an env for your exact board.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    waspinator/AccelStepper @ ^1.64.1
    olikraus/U8g2 @ ^2.35.19
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-s2-saola-1]
board = esp32-s2-saola-1
